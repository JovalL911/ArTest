<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>AR Surface</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family:-apple-system,sans-serif; }

    /* live camera behind everything */
    #cam-video {
      position:fixed; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      z-index:0;
    }

    /* A-Frame canvas transparent on top of video */
    #scene-wrap {
      position:fixed; inset:0; z-index:1;
    }
    canvas { background:transparent !important; }

    /* UI on top */
    #ui { position:fixed; inset:0; z-index:10; pointer-events:none; }

    #title {
      position:absolute; top:16px; left:50%; transform:translateX(-50%);
      font-size:13px; font-weight:700; letter-spacing:2px;
      text-transform:uppercase; color:rgba(255,255,255,0.85);
    }

    #status {
      position:absolute; bottom:140px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.6); color:#fff;
      padding:10px 22px; border-radius:25px; font-size:14px;
      backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.15);
      white-space:nowrap; max-width:90vw; text-align:center;
    }

    #place-btn {
      position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
      pointer-events:all;
      background:linear-gradient(135deg,#00c9ff,#92fe9d);
      color:#000; font-weight:800; font-size:16px; border:none;
      padding:18px 44px; border-radius:50px; cursor:pointer;
      box-shadow:0 0 30px rgba(0,201,255,0.4);
      letter-spacing:0.5px;
    }
    #place-btn:active { transform:translateX(-50%) scale(0.96); }

    #clear-btn {
      position:absolute; top:18px; right:16px; pointer-events:all;
      background:rgba(255,255,255,0.12); color:#fff;
      border:1px solid rgba(255,255,255,0.25);
      padding:8px 16px; border-radius:20px; font-size:13px;
      cursor:pointer; display:none; backdrop-filter:blur(6px);
    }

    #counter {
      position:absolute; top:18px; left:16px;
      background:rgba(0,0,0,0.4); color:#0f0;
      border:1px solid rgba(0,255,100,0.3);
      padding:6px 14px; border-radius:20px; font-size:13px;
      display:none;
    }
  </style>
</head>
<body>

<video id="cam-video" autoplay playsinline muted></video>

<div id="scene-wrap"></div>

<div id="ui">
  <div id="title">🔍 AR Surface</div>
  <div id="status">📷 Kamera wird gestartet…</div>
  <div id="counter"></div>
  <button id="clear-btn" onclick="clearAll()">✕ Löschen</button>
  <button id="place-btn" onclick="placeObject()">✦ Objekt platzieren</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>
<script>
// ── Build A-Frame scene programmatically ──────────────────────────────────────
const scene = document.createElement('a-scene');
scene.setAttribute('embedded', '');
scene.setAttribute('vr-mode-ui', 'enabled: false');
scene.setAttribute('renderer', 'alpha: true; antialias: true; logarithmicDepthBuffer: true');
scene.setAttribute('background', 'transparent: true');

// Lights
const al = document.createElement('a-light');
al.setAttribute('type','ambient'); al.setAttribute('intensity','0.8');
scene.appendChild(al);

const dl = document.createElement('a-light');
dl.setAttribute('type','directional'); dl.setAttribute('position','1 3 2'); dl.setAttribute('intensity','1');
scene.appendChild(dl);

// Object container
const objRoot = document.createElement('a-entity');
objRoot.id = 'obj-root';
scene.appendChild(objRoot);

// Fixed camera at origin, looking straight ahead (no controls that move it)
const cam = document.createElement('a-camera');
cam.setAttribute('position','0 0 0');
cam.setAttribute('look-controls','enabled: false');
cam.setAttribute('wasd-controls','enabled: false');
scene.appendChild(cam);

document.getElementById('scene-wrap').appendChild(scene);

// ── Camera feed ───────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    const video = document.getElementById('cam-video');
    video.srcObject = stream;
    await video.play();
    setStatus('✅ Tippe „Objekt platzieren"');
  } catch(e) {
    console.warn('Camera error:', e);
    setStatus('⚠️ Kein Kamerazugriff — Demo-Modus');
    document.getElementById('cam-video').style.background = 'linear-gradient(135deg,#0d1a0d,#1a2a1a)';
    setStatus('✅ Demo-Modus — Tippe „Objekt platzieren"');
  }
}

// ── Place object ─────────────────────────────────────────────────────────────
const SHAPES = ['box','sphere','cylinder','cone','torus'];
const COLORS = ['#FF6B6B','#4ECDC4','#45B7D1','#F7DC6F','#BB8FCE','#52BE80','#F0B27A'];
let count = 0;

function placeObject() {
  const shape = SHAPES[count % SHAPES.length];
  const color = COLORS[count % COLORS.length];
  count++;

  // Spread objects in a row in front of camera: x from -1 to +1, fixed z=-2, y=0
  const x = ((count - 1) % 5) * 0.6 - 1.2;
  const y = -0.5;   // slightly below eye level
  const z = -2;     // 2 metres in front of camera

  const el = document.createElement('a-' + shape);
  el.setAttribute('position', `${x} ${y} ${z}`);
  el.setAttribute('material', `color:${color}; metalness:0.3; roughness:0.4`);

  if (shape === 'box')        el.setAttribute('scale','0.3 0.3 0.3');
  else if (shape === 'sphere')     el.setAttribute('radius','0.18');
  else if (shape === 'cylinder')   { el.setAttribute('radius','0.13'); el.setAttribute('height','0.3'); }
  else if (shape === 'cone')       { el.setAttribute('radius-bottom','0.16'); el.setAttribute('height','0.3'); }
  else if (shape === 'torus')      { el.setAttribute('radius','0.15'); el.setAttribute('radius-tubular','0.04'); }

  // Animate: float up-down
  el.setAttribute('animation__float',
    `property:position; from:${x} ${y} ${z}; to:${x} ${y+0.2} ${z}; dir:alternate; dur:1800; loop:true; easing:easeInOutSine`);
  // Animate: spin
  el.setAttribute('animation__rot',
    `property:rotation; to:0 360 0; dur:3500; loop:true; easing:linear`);
  // Animate: pop in
  el.setAttribute('scale','0.001 0.001 0.001');
  el.setAttribute('animation__pop',
    `property:scale; to:1 1 1; dur:350; easing:easeOutBack`);

  objRoot.appendChild(el);

  document.getElementById('counter').style.display = 'block';
  document.getElementById('counter').textContent = `${count} Objekt${count>1?'e':''}`;
  document.getElementById('clear-btn').style.display = 'block';
  setStatus(`✨ ${shape} (${count}) platziert`);
}

function clearAll() {
  while(objRoot.firstChild) objRoot.removeChild(objRoot.firstChild);
  count = 0;
  document.getElementById('counter').style.display = 'none';
  document.getElementById('clear-btn').style.display = 'none';
  setStatus('🗑️ Geleert');
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// ── Start ─────────────────────────────────────────────────────────────────────
startCamera();
</script>
</body>
</html>
