<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>AR Surface v4</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body { margin:0; font-family: -apple-system, sans-serif; }
    #overlay {
      position: fixed; inset: 0; z-index: 999;
      pointer-events: none;
    }
    #log {
      position: absolute; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.75); color: #0f0;
      padding: 10px; border-radius: 10px;
      font-size: 11px; font-family: monospace;
      max-height: 40vh; overflow-y: auto;
      border: 1px solid #0f0;
    }
    #log div { border-bottom: 1px solid rgba(0,255,0,0.15); padding: 2px 0; }
    #version {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,0.6); color: #ff0;
      padding: 4px 10px; border-radius: 10px;
      font-size: 11px; font-family: monospace;
    }
    #msg {
      position: absolute; bottom: 140px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff;
      padding: 11px 22px; border-radius: 25px; font-size: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center; white-space: nowrap; max-width: 88vw;
    }
    #enter-btn {
      position: absolute; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      pointer-events: all;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #000; font-weight: 800; font-size: 16px; border: none;
      padding: 16px 40px; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 25px rgba(0,200,255,0.4);
    }
  </style>
</head>
<body>

<div id="overlay">
  <div id="log"></div>
  <div id="version">v4 | A-Frame 1.7.1</div>
  <div id="msg">Tippe zum Starten</div>
  <button id="enter-btn" onclick="enterAR()">&#x1F50D; AR starten</button>
</div>

<a-scene
  webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #overlay;"
  ar-hit-test="target: #box;"
  vr-mode-ui="enabled: false"
  renderer="colorManagement: true;">

  <a-box id="box"
    scale="0.2 0.2 0.2"
    material="color: #4ECDC4; metalness: 0.3; roughness: 0.4"
    visible="false"
    animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear">
  </a-box>

  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="1 3 2" intensity="1.0"></a-light>
</a-scene>

<script>
  const scene = document.querySelector('a-scene');
  const msg   = document.getElementById('msg');
  const btn   = document.getElementById('enter-btn');
  const log   = document.getElementById('log');

  function addLog(text, color) {
    const d = document.createElement('div');
    d.textContent = new Date().toISOString().substr(11,8) + ' ' + text;
    if (color) d.style.color = color;
    log.prepend(d);
  }

  // Startup checks
  addLog('Page loaded');
  addLog('navigator.xr: ' + (navigator.xr ? 'YES' : 'NO'), navigator.xr ? '#0f0' : '#f00');
  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then(function(ok) {
      addLog('immersive-ar supported: ' + (ok ? 'YES' : 'NO'), ok ? '#0f0' : '#f00');
    });
  }
  addLog('HTTPS: ' + (location.protocol === 'https:' ? 'YES' : 'NO'), location.protocol === 'https:' ? '#0f0' : '#f00');
  addLog('Host: ' + location.hostname);

  // A-Frame events
  scene.addEventListener('loaded',    function() { addLog('scene: loaded'); });
  scene.addEventListener('enter-vr',  function() {
    addLog('scene: enter-vr | ar-mode: ' + scene.is('ar-mode'), '#0ff');
    if (scene.is('ar-mode')) {
      btn.style.display = 'none';
      msg.textContent = 'Kamera an — Geraet schwenken...';
    }
  });
  scene.addEventListener('exit-vr',   function() { addLog('scene: exit-vr'); btn.style.display='block'; msg.textContent='Tippe zum Starten'; });
  scene.addEventListener('ar-hit-test-start',    function() { addLog('HIT-TEST: start', '#ff0'); msg.textContent = 'Scanning...'; });
  scene.addEventListener('ar-hit-test-achieved', function() { addLog('HIT-TEST: achieved! Flaeche gefunden!', '#0f0'); msg.textContent = 'Flaeche erkannt! Tippen zum Platzieren'; });
  scene.addEventListener('ar-hit-test-select',   function() { addLog('HIT-TEST: select (placed!)', '#0f0'); msg.textContent = 'Platziert!'; });

  // Catch JS errors
  window.addEventListener('error', function(e) {
    addLog('ERROR: ' + e.message, '#f00');
  });

  function enterAR() {
    addLog('enterAR() called...');
    scene.enterAR().then(function() {
      addLog('enterAR() promise resolved', '#0f0');
    }).catch(function(err) {
      addLog('enterAR() FAILED: ' + err, '#f00');
      msg.textContent = 'Fehler: ' + err;
    });
  }
</script>

</body>
</html>
