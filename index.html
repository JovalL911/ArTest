<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>AR Surface</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    #overlay {
      position: fixed; inset: 0; z-index: 999;
      pointer-events: none;
      font-family: -apple-system, sans-serif;
    }
    #msg {
      position: absolute; bottom: 140px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: #fff;
      padding: 11px 22px; border-radius: 25px; font-size: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center; white-space: nowrap; max-width: 88vw;
    }
    #enter-btn {
      position: absolute; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      pointer-events: all;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #000; font-weight: 800; font-size: 16px; border: none;
      padding: 16px 40px; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 25px rgba(0,200,255,0.4);
    }
  </style>
</head>
<body>

<div id="overlay">
  <div id="msg">Tippe zum Starten</div>
  <button id="enter-btn" onclick="enterAR()">&#x1F50D; AR starten</button>
</div>

<a-scene
  webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #overlay;"
  ar-hit-test="target: #box;"
  vr-mode-ui="enabled: false"
  renderer="colorManagement: true;">

  <a-box id="box"
    scale="0.2 0.2 0.2"
    material="color: #4ECDC4; metalness: 0.3; roughness: 0.4"
    visible="false"
    animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear">
  </a-box>

  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="1 3 2" intensity="1.0"></a-light>
</a-scene>

<script>
  const scene = document.querySelector('a-scene');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('enter-btn');

  scene.addEventListener('enter-vr', function() {
    if (!scene.is('ar-mode')) return;
    btn.style.display = 'none';
    msg.textContent = 'Kamera schwenken um Flaeche zu finden...';
  });

  scene.addEventListener('exit-vr', function() {
    btn.style.display = 'block';
    msg.textContent = 'Tippe zum Starten';
  });

  scene.addEventListener('ar-hit-test-start', function() {
    msg.textContent = 'Oberflaechensuche laeuft...';
  });

  scene.addEventListener('ar-hit-test-achieved', function() {
    msg.textContent = 'Flaeche erkannt! Auf den Bildschirm tippen zum Platzieren.';
  });

  scene.addEventListener('ar-hit-test-select', function() {
    msg.textContent = 'Platziert! Erneut tippen zum Verschieben.';
  });

  function enterAR() {
    scene.enterAR();
  }
</script>

</body>
</html>
