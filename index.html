<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>AR Surface</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      font-family: -apple-system, sans-serif;
    }
    #msg {
      position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #fff;
      padding: 10px 20px; border-radius: 25px; font-size: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center; white-space: nowrap;
    }
    #scan-btn, #place-btn {
      position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
      pointer-events: all;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #000; font-weight: 800; font-size: 16px; border: none;
      padding: 16px 40px; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 25px rgba(0,200,255,0.4);
    }
    #place-btn { display: none; }
  </style>
</head>
<body>

<div id="overlay">
  <div id="msg">Tippe „Scan starten"</div>
  <button id="scan-btn" onclick="startScan()">🔍 Scan starten</button>
  <button id="place-btn" onclick="placeObject()">✦ Objekt platzieren</button>
</div>

<a-scene
  webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #overlay;"
  ar-hit-test="enabled: false; target: #reticle;"
  vr-mode-ui="enabled: false"
  renderer="colorManagement: true;">

  <!-- Reticle: sichtbar beim Scannen, zeigt erkannte Fläche -->
  <a-ring id="reticle"
    radius-inner="0.04" radius-outer="0.06"
    rotation="-90 0 0"
    material="color: #00ffcc; side: double"
    visible="false">
    <!-- Scan-Gitter als Child -->
    <a-plane
      width="0.3" height="0.3"
      rotation="0 0 0"
      material="color: #00ff88; wireframe: true; transparent: true; opacity: 0.5; side: double">
    </a-plane>
  </a-ring>

  <!-- Das 3D Objekt — wird bei Tap hierher teleportiert -->
  <a-box id="mybox"
    scale="0.15 0.15 0.15"
    material="color: #4ECDC4; metalness: 0.3; roughness: 0.4"
    visible="false"
    animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear"
    animation__float="property: position; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
  </a-box>

  <a-light type="ambient" intensity="0.7"></a-light>
  <a-light type="directional" position="1 3 2" intensity="0.8"></a-light>
</a-scene>

<script>
  const scene = document.querySelector('a-scene');
  const msg = document.getElementById('msg');
  const scanBtn = document.getElementById('scan-btn');
  const placeBtn = document.getElementById('place-btn');
  const box = document.getElementById('mybox');

  // Events von ar-hit-test
  scene.addEventListener('ar-hit-test-start', () => {
    msg.textContent = '🔍 Oberfläche wird gesucht…';
  });

  scene.addEventListener('ar-hit-test-achieved', () => {
    msg.textContent = '✅ Fläche erkannt — tippe zum Platzieren';
    placeBtn.style.display = 'block';
    scanBtn.style.display = 'none';
  });

  scene.addEventListener('ar-hit-test-select', (e) => {
    // Objekt wird automatisch platziert durch target:#mybox
    const pos = box.getAttribute('position');
    // Float-Animation vom aktuellen Y aus
    box.setAttribute('animation__float',
      `property: position; from: ${pos.x} ${pos.y} ${pos.z}; to: ${pos.x} ${pos.y + 0.12} ${pos.z}; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine`
    );
    msg.textContent = '✨ Platziert! Tippe erneut zum Verschieben';
  });

  function startScan() {
    // AR Session starten (Enter AR)
    scene.enterAR().then(() => {
      // Hit-test aktivieren
      scene.setAttribute('ar-hit-test', 'enabled: true; target: #mybox;');
      scanBtn.style.display = 'none';
      msg.textContent = '📷 Kamera wird gestartet…';
    }).catch(err => {
      msg.textContent = '⚠️ WebXR AR nicht verfügbar (Chrome Android nötig)';
    });
  }

  function placeObject() {
    // Manuell select-Event triggern
    scene.components['ar-hit-test'].el.emit('select');
  }
</script>

</body>
</html>
